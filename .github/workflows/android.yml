name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Install Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle
    - name: Generate Wrapper and Build with Gradle
      run: |
        gradle wrapper --gradle-version 8.3
        chmod +x gradlew
        ./gradlew build
    - name: Upload Testing APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
